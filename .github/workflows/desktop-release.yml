name: Desktop-Programm bauen (Windows)

# Baut das ÖBB-Tool als Windows-Programm (Installer) und veröffentlicht es
# unter "Releases". Auslösen: neuen Tag pushen, z. B.
#   git tag desktop-v0.1.1 && git push origin desktop-v0.1.1
# (vorher die Versionsnummer in src-tauri/tauri.conf.json erhöhen)
# oder im Actions-Tab "Run workflow".
#
# Automatische Updates brauchen das Secret TAURI_SIGNING_PRIVATE_KEY
# (Settings > Secrets and variables > Actions). Fehlt es, entsteht trotzdem
# ein Installer – nur ohne Update-Datei (latest.json).

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      HAT_SCHLUESSEL: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust einrichten
        uses: dtolnay/rust-toolchain@stable

      - name: Rust-Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Ohne Signaturschlüssel keine Update-Dateien
        if: env.HAT_SCHLUESSEL != 'true'
        shell: bash
        run: echo 'TAURI_ARGS=--config {"bundle":{"createUpdaterArtifacts":false}}' >> "$GITHUB_ENV"

      - name: Bauen und als Release veröffentlichen
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: desktop-v__VERSION__
          releaseName: 'ÖBB-Tool __VERSION__ (Windows)'
          releaseBody: |
            **Installieren:** unten unter "Assets" die Datei `OEBB-Tool_…_x64-setup.exe` herunterladen und starten.
            Keine Administratorrechte nötig. Windows-SmartScreen ggf. mit "Weitere Informationen" → "Trotzdem ausführen" bestätigen.
          releaseDraft: false
          prerelease: false
          args: ${{ env.TAURI_ARGS }}
