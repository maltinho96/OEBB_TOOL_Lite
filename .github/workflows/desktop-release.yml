name: Desktop-Programm bauen (Windows + Ubuntu)

# Baut das ÖBB-Tool als Windows-Programm (Installer) und als Ubuntu-Paket
# (.deb) und veröffentlicht beides unter "Releases" (Tag desktop-vX.Y.Z legt
# die Action selbst an). Danach baut deploy-pages.yml die apt-Paketquelle.
# Auslösen: in src-tauri/tauri.conf.json die Versionsnummer erhöhen und auf
# beta-neu pushen – oder im Actions-Tab "Run workflow".
#
# Automatische Updates brauchen das Secret TAURI_SIGNING_PRIVATE_KEY
# (Settings > Secrets and variables > Actions). Fehlt es, entsteht trotzdem
# ein Installer – nur ohne Update-Datei (latest.json).

on:
  push:
    branches: [beta-neu]
    paths: ['src-tauri/tauri.conf.json']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  bauen:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          # Ubuntu 22.04: läuft dann auf 22.04, 24.04 und neuer
          - os: ubuntu-22.04
            bundles: deb
    runs-on: ${{ matrix.os }}
    env:
      HAT_SCHLUESSEL: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Linux-Bibliotheken
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust einrichten
        uses: dtolnay/rust-toolchain@stable

      - name: Rust-Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Abhängigkeiten installieren
        run: npm ci

      # Update-Dateien gibt es nur für Windows (Linux: Updates über apt).
      - name: Bau-Optionen
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ] && [ "$HAT_SCHLUESSEL" = "true" ]; then
            echo 'TAURI_ARGS=--bundles ${{ matrix.bundles }}' >> "$GITHUB_ENV"
          else
            echo 'TAURI_ARGS=--bundles ${{ matrix.bundles }} --config {"bundle":{"createUpdaterArtifacts":false}}' >> "$GITHUB_ENV"
          fi

      - name: Bauen und als Release veröffentlichen
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: desktop-v__VERSION__
          releaseName: 'ÖBB-Tool __VERSION__'
          releaseBody: |
            **Windows:** unten unter "Assets" `OEBB-Tool_…_x64-setup.exe` herunterladen und starten (keine Administratorrechte nötig; SmartScreen ggf. mit "Weitere Informationen" → "Trotzdem ausführen").

            **Ubuntu (apt, mit automatischen Updates über `sudo apt upgrade`):**
            ```
            curl -fsSL https://maltinho96.github.io/OEBB_TOOL_Lite/apt/install.sh | sh
            ```
          releaseDraft: false
          prerelease: false
          args: ${{ env.TAURI_ARGS }}

  # Danach die apt-Paketquelle auf GitHub Pages neu bauen.
  apt-aktualisieren:
    needs: bauen
    runs-on: ubuntu-latest
    steps:
      - name: Pages-Workflow starten
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-pages.yml --repo "${{ github.repository }}" --ref beta-neu
