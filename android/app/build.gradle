// Android-App des ÖBB-Tools – eigenständig, ohne Chrome.
//
// Die Web-App (npm run build:android -> dist) wird als assets/www in die APK
// gepackt und im Android System WebView ausgeführt (MainActivity.java).
// Der Gradle-Task webAppKopieren erledigt das vor jedem Bau.
//
// Version: -PappVersion=0.6.0 (aus src-tauri/tauri.conf.json, setzt die CI).
// Signatur: Umgebungsvariablen KS_FILE / KS_PASS (Alias "app").
plugins {
    id 'com.android.application'
}

def appVersion = (project.findProperty('appVersion') ?: '0.0.1').toString()
def teile = appVersion.tokenize('.').collect { it.toInteger() }
def code = teile[0] * 10000 + teile[1] * 100 + teile[2]

android {
    namespace 'de.nettec.oebbtool'
    compileSdk 34

    defaultConfig {
        applicationId 'de.nettec.oebbtool'
        minSdk 23
        targetSdk 34
        versionCode code
        versionName appVersion
    }

    signingConfigs {
        release {
            if (System.getenv('KS_FILE')) {
                storeFile file(System.getenv('KS_FILE'))
                storePassword System.getenv('KS_PASS')
                keyAlias System.getenv('KS_ALIAS') ?: 'app'
                keyPassword System.getenv('KS_PASS')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}

// Fertig gebaute Web-App (../../dist) in die APK übernehmen.
def webQuelle = file('../../dist')
def webZiel = file('src/main/assets/www')
tasks.register('webAppKopieren', Sync) {
    from webQuelle
    into webZiel
    doFirst {
        if (!webQuelle.exists()) throw new GradleException('dist fehlt – vorher "npm run build:android" ausführen')
    }
}
preBuild.dependsOn webAppKopieren
